<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.1 做功与电势能 · 可交互课件</title>
<style>
  :root{
    /* 配色照参考视频《[manim可视化]“看见”电场》：深灰底 + 暖红(正) + 冷蓝(负) + 浅白网格 */
    --bg:#1b1b1b; --bg2:#232323; --panel:#262626; --line:#3a3a3a; --line2:#4a4a4a;
    --ink:#f2f2f2; --ink2:#b9b9b9; --muted:#8a8a8a;
    --pos:#e2574a;      /* 正电势能：暖红 */
    --pos2:#f0836f;
    --neg:#3f93d6;      /* 负电势能：冷蓝 */
    --neg2:#79bce8;
    --wire:#e8e8e8;     /* 网格线 */
    --gold:#ffd75e;     /* 高亮/关键量 */
    --green:#7fd18a;
    --phi:#c79bf0;      /* 电势 φ */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
    overflow:hidden;
  }
  .app{display:grid; grid-template-rows:auto 1fr auto auto; height:100vh;}

  /* ---------- 顶部 ---------- */
  header{display:flex; align-items:baseline; gap:14px; padding:10px 18px 8px; flex-wrap:wrap; row-gap:3px;
    background:var(--bg2); border-bottom:1px solid var(--line);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap;}
  .stepsn{margin-left:auto;}
  .act{font-size:13px; color:var(--gold); border:1px solid var(--line2); border-radius:10px;
    padding:1px 9px; white-space:nowrap;}
  .steptitle{font-size:15px; color:var(--ink); font-weight:600;}
  .stepsn{margin-left:auto; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums;}

  /* ---------- 主体 ---------- */
  .stage{display:grid; grid-template-columns:1fr 268px; min-height:0;}
  .canvaswrap{position:relative; min-width:0; min-height:0; padding:6px 8px 0 8px;}
  canvas{display:block; width:100%; height:100%;}
  .hint{padding:7px 20px 0 20px; font-size:12.5px; color:var(--muted); height:36px; overflow:hidden;}
  .hint b{color:var(--gold); font-weight:600;}

  /* ---------- 右栏读数 ---------- */
  aside{background:var(--panel); border-left:1px solid var(--line); padding:12px 14px; overflow:auto;}
  .rd{display:flex; justify-content:space-between; align-items:baseline;
      padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .rd:last-of-type{border-bottom:none;}
  .rd span{color:var(--ink2);}
  .rd b{font-size:17px; font-variant-numeric:tabular-nums; letter-spacing:.3px;}
  .rd b.pos{color:var(--pos2);} .rd b.neg{color:var(--neg2);} .rd b.gold{color:var(--gold);}
  .rd b.phi{color:var(--phi);} .rd b.green{color:var(--green);}
  aside h3{font-size:12px; color:var(--muted); margin:15px 0 4px; font-weight:600; letter-spacing:1px;}
  .formula{font-size:13.5px; color:var(--ink); line-height:1.85;}
  .formula em{color:var(--gold); font-style:normal;}
  .note{font-size:12.5px; color:var(--ink2); line-height:1.7; margin-top:8px;}

  /* ---------- 底部控制 ---------- */
  footer{display:flex; align-items:center; gap:12px; padding:9px 18px 11px;
    background:var(--bg2); border-top:1px solid var(--line); flex-wrap:wrap;}
  button{font-family:inherit; font-size:13.5px; color:var(--ink); background:#333;
    border:1px solid var(--line2); border-radius:8px; padding:6px 14px; cursor:pointer;}
  button:hover{background:#3d3d3d; border-color:#5a5a5a;}
  button:active{transform:translateY(1px);}
  button.main{background:#3a4a3a; border-color:#4f6b4f;}
  button.main:hover{background:#445544;}
  button.on{background:#4a4430; border-color:var(--gold); color:#ffe9a8;}
  .bar{flex:1; min-width:180px; height:6px; background:#333; border-radius:4px; position:relative; cursor:pointer;}
  .bar i{position:absolute; left:0; top:0; bottom:0; background:var(--gold); border-radius:4px;}
  .bar u{position:absolute; top:-4px; width:2px; height:14px; background:#666;}
  .slider{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink2);}
  .slider input[type=range]{width:132px; accent-color:var(--gold);}
  .slider b{color:var(--ink); font-variant-numeric:tabular-nums; min-width:38px; display:inline-block; text-align:right;}
  .grp{display:flex; gap:6px; align-items:center;}
  .grp .lab{font-size:12.5px; color:var(--muted);}
  .hidden{display:none !important;}
  @media (max-width:980px){
    /* 窄屏：画布高度用 vh 钉死，避免每步文字行数不同导致画面尺寸漂移 */
    .stage{grid-template-columns:1fr; grid-template-rows:auto auto;}
    .canvaswrap{height:46vh;}
    aside{border-left:none; border-top:1px solid var(--line); max-height:30vh; overflow:auto;}
    .hint{height:32px;}
  }
  @media (max-width:760px){
    header{padding:8px 12px 6px; gap:8px;}
    header h1{font-size:13.5px;}
    .act{font-size:11.5px; padding:0 7px;}
    .steptitle{font-size:13px;}
    .stepsn{font-size:12px;}
    .hint{padding:6px 12px 0; font-size:12px;}
    footer{padding:7px 10px 9px; gap:8px;}
    button{font-size:12.5px; padding:5px 10px;}
    .slider input[type=range]{width:90px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>10.1 电势能和电势 · 做功与电势能</h1>
    <span class="act" id="actTag">第一幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 16</span>
  </header>

  <div class="stage">
    <div class="canvaswrap">
      <canvas id="cv"></canvas>
    </div>
    <aside>
      <div class="rd"><span>静电力做的功 W</span><b class="gold" id="rdW">0.0 J</b></div>
      <div class="rd"><span>电势能 E<sub>p</sub></span><b id="rdEp">0.0 J</b></div>
      <div class="rd"><span>电势能的变化 ΔE<sub>p</sub></span><b class="green" id="rddEp">0.0 J</b></div>
      <div class="rd"><span>电势 φ = E<sub>p</sub>/q</span><b class="phi" id="rdPhi">0.0 V</b></div>
      <div class="rd"><span>位置 x</span><b id="rdX">0.00 m</b></div>
      <div class="rd"><span>到零势能面距离 d</span><b id="rdD">0.00 m</b></div>
      <div class="rd"><span>电荷量 q</span><b id="rdQ">+1.0 C</b></div>
      <div class="rd"><span>场强 E</span><b id="rdE">2.0 N/C</b></div>

      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula"></div>

      <h3>视角</h3>
      <div class="grp" id="wrapView" style="flex-wrap:wrap">
        <button data-view="oblique">斜视</button>
        <button data-view="top">俯视</button>
        <button data-view="side">侧视</button>
        <button data-view="reset">↺ 复位</button>
      </div>
      <div class="note" style="margin-top:6px">在三维图上<b style="color:var(--gold)">拖动空白处</b>可自由旋转视角，滚轮缩放，双击复位。下面俯视图始终是“物理空间”的正视图。</div>

      <h3>提示</h3>
      <div class="note" id="rdNote"></div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev">◀ 上一步</button>
    <button id="btnNext" class="main">下一步 ▶</button>
    <button id="btnReset">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>

    <div class="slider" id="wrapT">
      <span>走到哪儿</span><input type="range" id="rgT" min="0" max="100" value="100"><b id="lbT">100%</b>
    </div>
    <div class="slider" id="wrapN">
      <span>分段数 N</span><input type="range" id="rgN" min="1" max="32" step="1" value="16"><b id="lbN">16</b>
    </div>
    <div class="slider" id="wrapE">
      <span>场强 E</span><input type="range" id="rgE" min="1" max="2.5" step="0.1" value="2"><b id="lbE">2.0</b>
    </div>
    <div class="grp" id="wrapPath">
      <span class="lab">路径</span>
      <button data-path="line">直线</button>
      <button data-path="poly">折线</button>
      <button data-path="curve">曲线</button>
    </div>
    <div class="grp" id="wrapQ">
      <span class="lab">电荷 q</span>
      <button data-q="2">+2q</button>
      <button data-q="1">+q</button>
      <button data-q="-1">−q</button>
      <button data-q="-2">−2q</button>
    </div>
  </footer>
</div>

<script>
/* =====================================================================
   viz_physics.js —— 纯物理内核（不依赖 DOM，可在 node 里直接跑自检）

   课题：10.1 电势能和电势 · 匀强电场中的"功"与"电势能"
   口径与《10.1_电势能和电势_原理可视化.html》完全一致，避免课堂上两处数字打架：
     E  = 2.0 N/C（方向 +x）        |x| ≤ 2.8 m
     q  ∈ {+2, +1, −1, −2} C        零势能面 x0 可移动
     W  = qE·Δx                     只与始末位置有关（与路径无关）
     Ep = qE·(x0 − x)               ΔEp = −W   （沿场线方向电势能降低 → 正电荷顺场线“下坡”）
     φ  = Ep/q = E·(x0 − x)         与试探电荷无关；沿场线方向 φ 降低
   ===================================================================== */
(function (global) {
  'use strict';

  var E_FIELD = 2.0;               // 匀强电场场强 (N/C)，方向沿 +x
  var X_MIN = -2.8, X_MAX = 2.8;   // 场区范围 (m)
  var Q_LIST = [2, 1, -1, -2];     // 可切换的电荷量 (C)

  /* ---------- 基本量 ---------- */

  /** 静电力做的功：W = qE(x2 − x1)，只与始末位置有关 */
  function work(q, x1, x2, E) {
    E = (E === undefined ? E_FIELD : E);
    return q * E * (x2 - x1);
  }

  /** 电势能：以 x0 为零势能面，Ep(x) = qE(x0 − x)（沿场线方向减小） */
  function epAt(q, x, x0, E) {
    E = (E === undefined ? E_FIELD : E);
    return q * E * (x0 - x);
  }

  /** 电势：φ(x) = E(x0 − x)，与试探电荷无关（有正负，沿场线方向降低） */
  function phiAt(x, x0, E) {
    E = (E === undefined ? E_FIELD : E);
    return E * (x0 - x);
  }

  /** 静电力矢量（大小与方向）：正电荷沿 +x，负电荷沿 −x */
  function force(q, E) {
    E = (E === undefined ? E_FIELD : E);
    return q * E;
  }

  /* ---------- 路径 ---------- */

  /**
   * 任意曲线：从 A 到 B 的平滑曲线（中点向上鼓），离散成 N 段
   * 说明：曲线形状与"做功"无关，这里只取一条"看起来明显是弯的"曲线当代表
   */
  function curvePoints(A, B, N) {
    N = Math.max(1, Math.round(N || 16));
    var amp = 0.45 + 0.35 * (B.y - A.y);      // 鼓起的幅度（m）
    var pts = [];
    for (var i = 0; i <= N; i++) {
      var t = i / N;
      pts.push({
        x: A.x + (B.x - A.x) * t,
        y: A.y + (B.y - A.y) * t + amp * Math.sin(Math.PI * t)
      });
    }
    return pts;
  }

  /**
   * 把一条折线（点列）拆成"每小段"的账：
   *   每小段再分成「沿场线的一步 Δx」＋「横穿的一步 Δy」
   *   沿场线：ΔW = qE·Δx        横穿：F ⊥ 位移 → ΔW = 0
   * 返回 { W, sumDx, sumDy, segs:[{x1,y1,x2,y2,dx,dy,w,wAlong,wCross}] }
   */
  function accumulate(points, q, E) {
    E = (E === undefined ? E_FIELD : E);
    var segs = [], W = 0, sumDx = 0, sumDy = 0;
    for (var i = 0; i + 1 < points.length; i++) {
      var p1 = points[i], p2 = points[i + 1];
      var dx = p2.x - p1.x, dy = p2.y - p1.y;
      var wAlong = q * E * dx;      // 沿场线走的那一步
      var wCross = 0;               // 横穿：F 与位移垂直，不做功
      segs.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, dx: dx, dy: dy, w: wAlong + wCross, wAlong: wAlong, wCross: wCross });
      W += wAlong + wCross; sumDx += dx; sumDy += dy;
    }
    return { W: W, sumDx: sumDx, sumDy: sumDy, segs: segs };
  }

  /** 三条典型路径：直线 A→B、折线 A→M→B（M 为 A 沿场线到 B 的垂足）、任意曲线 */
  function pathsFor(A, B, N) {
    var M = { x: B.x, y: A.y };               // 先沿场线、再横穿的那个拐点
    return {
      M: M,
      line: [A, B],
      polyline: [A, M, B],
      curve: curvePoints(A, B, N)
    };
  }

  /* ---------- 自检 ---------- */

  function _eq(a, b, tol) { return Math.abs(a - b) <= (tol === undefined ? 1e-9 : tol); }

  function runSelfTest() {
    var fails = [], checks = 0;
    function ok(cond, msg) { checks++; if (!cond) fails.push(msg); }

    var As = [{ x: -2.0, y: -0.8 }, { x: -1.0, y: 0.2 }, { x: 0.4, y: 0.6 }];
    var Bs = [{ x: 1.6, y: 0.8 }, { x: -2.4, y: 0.3 }, { x: 2.2, y: -0.6 }, { x: 0.0, y: 0.9 }];
    var Ns = [1, 2, 3, 5, 8, 16, 32, 64];
    var qs = [2, 1, -1, -2];

    // 1) 路径无关：三条路径的 W 都等于 qE·(B.x − A.x)
    for (var ai = 0; ai < As.length; ai++) {
      for (var bi = 0; bi < Bs.length; bi++) {
        var A = As[ai], B = Bs[bi];
        for (var qi = 0; qi < qs.length; qi++) {
          var q = qs[qi], Wexact = work(q, A.x, B.x);
          var P = pathsFor(A, B, 16);
          var rl = accumulate(P.line, q), rp = accumulate(P.polyline, q);
          ok(_eq(rl.W, Wexact), '直线 W 不符: A=' + JSON.stringify(A) + ' B=' + JSON.stringify(B) + ' q=' + q);
          ok(_eq(rp.W, Wexact), '折线 W 不符: A=' + JSON.stringify(A) + ' B=' + JSON.stringify(B) + ' q=' + q);
          for (var ni = 0; ni < Ns.length; ni++) {
            var rc = accumulate(curvePoints(A, B, Ns[ni]), q);
            ok(_eq(rc.W, Wexact), '曲线 N=' + Ns[ni] + ' 的 W 不符');
            ok(_eq(rc.sumDx, B.x - A.x), '曲线 N=' + Ns[ni] + ' 的 ΣΔx 不等于 Δx');
          }
        }
      }
    }

    // 2) 微元拆账：横穿项恒为 0；沿场线项之和 = 总功
    var P2 = pathsFor({ x: -1.5, y: -0.5 }, { x: 1.5, y: 0.9 }, 12);
    var segs = accumulate(P2.curve, 1).segs, sAlong = 0, sCross = 0, sTotal = 0;
    for (var i = 0; i < segs.length; i++) { sAlong += segs[i].wAlong; sCross += segs[i].wCross; sTotal += segs[i].w; }
    ok(_eq(sCross, 0), '横穿项之和应为 0，实际 ' + sCross);
    ok(_eq(sAlong, sTotal), '沿场线项之和应等于总功');
    ok(_eq(sTotal, work(1, -1.5, 1.5)), '微元总功应等于 qE·Δx');

    // 3) 电势能的变化与路径无关；与零点选取无关
    var WA = work(2, -1.0, 1.5);
    var x0s = [-2.0, 0, 1.0, 2.5];
    for (var xi = 0; xi < x0s.length; xi++) {
      var x0 = x0s[xi];
      var dEp = epAt(2, 1.5, x0) - epAt(2, -1.0, x0);
      ok(_eq(dEp, -WA), 'x0=' + x0 + ' 时 ΔEp 应等于 −W');
    }

    // 4) φ 与试探电荷无关：Ep/q 恒等于 φ
    for (var qi2 = 0; qi2 < qs.length; qi2++) {
      var q2 = qs[qi2];
      ok(_eq(epAt(q2, 1.2, 0.5) / q2, phiAt(1.2, 0.5)), 'Ep/q 应等于 φ（q=' + q2 + '）');
    }

    // 5) 沿场线方向 φ 降低；负电荷反转：φ 高处 −q 的电势能反而小
    var xa = -1.0, xb = 1.5, x0b = 0;
    ok(phiAt(xa, x0b) > phiAt(xb, x0b), '沿场线方向 φ 应逐渐降低');
    ok(epAt(1, xa, x0b) > epAt(1, xb, x0b), '+q 在 φ 高处 Ep 应更大');
    ok(epAt(-1, xa, x0b) < epAt(-1, xb, x0b), '−q 在 φ 高处 Ep 应更小（负电荷反转）');
    ok(_eq(work(1, xa, xb), epAt(1, xa, x0b) - epAt(1, xb, x0b)), 'W_AB 应等于 EpA − EpB');

    // 6) 边界：q=0、d=0、B 在 A 左侧
    ok(_eq(work(0, -1, 1), 0), 'q=0 时不做功');
    ok(_eq(work(2, 1.2, 1.2), 0), '始末相同不做功');
    ok(work(2, 1.6, -0.4) < 0, 'B 在 A 左侧时应做负功');

    return { pass: fails.length === 0, checks: checks, failed: fails };
  }

  var api = {
    E_FIELD: E_FIELD, X_MIN: X_MIN, X_MAX: X_MAX, Q_LIST: Q_LIST,
    work: work, epAt: epAt, phiAt: phiAt, force: force,
    curvePoints: curvePoints, accumulate: accumulate, pathsFor: pathsFor,
    runSelfTest: runSelfTest
  };

  global.VizPhys = api;
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; }
})(typeof window !== 'undefined' ? window : globalThis);

/* =====================================================================
   viz_render.js —— 绘制层

   视觉语言（照参考视频《[manim可视化]“看见”电场》）：
     把电势能画成一张“能量地形面”：
       · 面的高低 = 电势能 Ep 的大小（红色=正、蓝色=负、白色网格）
       · 匀强电场里这张面是一张“等倾斜的坡”
       · 横向（垂直于场线）方向是等高线 —— 沿着等高线走，高度不变
     下面一条俯视图放“物理空间”：平行板、场线、三条路径、零势能面、电荷与静电力
     两张图共用同一条 u 轴（沿场线方向），一眼对上。
   ===================================================================== */
(function (global) {
  'use strict';

  var P = global.VizPhys;

  /* ---------- 配色（可用取色脚本按参考视频校准；只改这一处） ---------- */
  var THEME = {
    bg: '#1b1b1b',
    posFill: 'rgba(226,87,74,0.42)',     // 正电势能：暖红
    posLine: '#f0836f',
    negFill: 'rgba(63,147,214,0.42)',    // 负电势能：冷蓝
    negLine: '#79bce8',
    wire: 'rgba(232,232,232,0.30)',      // 白色网格
    wireStrong: 'rgba(255,255,255,0.55)',
    base: 'rgba(150,150,150,0.16)',      // 零势能基准面
    baseLine: 'rgba(160,160,160,0.35)',
    ink: '#f2f2f2', ink2: '#c8c8c8', muted: '#9a9a9a',
    gold: '#ffd75e', green: '#7fd18a', phi: '#c79bf0',
    path: { line: '#ffd75e', poly: '#7fd18a', curve: '#c79bf0' },
    zero: '#ffffff',
    hot: '#ff6b5a'
  };

  var U0 = -2.0, U1 = 2.0;        // 沿场线方向的范围 (m)
  var V0 = -1.2, V1 = 1.2;        // 垂直方向的范围 (m)
  var X0MIN = -1.2, X0MAX = 1.2;  // 零势能面可放的范围 (m)
  var HMAX = 12;                  // 高度轴可视范围 (J)

  /* ---------- 基础 ---------- */
  function fitCanvas(cv) {
    var dpr = Math.min(2, global.devicePixelRatio || 1);
    var r = cv.getBoundingClientRect();
    var W = Math.max(420, Math.round(r.width)), H = Math.max(300, Math.round(r.height));
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, W: W, H: H };
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  var KH = 0.085;                  // 米/(V 或 J)：把竖直方向折成“高度”，±10 ↔ ±0.85 m
  var QREF = 1;                    // 地形面按“单位正电荷”画 → 面的高度在数值上就是电势 φ

  /**
   * 场景几何：真正的正交三维相机
   *   cam = { az: 方位角(rad), el: 俯仰角(rad), zoom: 缩放 }
   *   世界坐标 (u, v, h)：u 沿场线、v 垂直于场线、h = Ep（按 KH 折成米）
   *   屏幕基：right = (cos az, −sin az, 0)，up = (−sin az·sin el, −cos az·sin el, cos el)
   *   拖动视角时自动取景，保证地面四角与高度范围始终在框内。
   */
  function makeScene(W, H, cam) {
    cam = cam || { az: 0.38, el: 0.45, zoom: 1 };
    var mainH = H * 0.70, stripTop = H * 0.735, stripH = H - stripTop - 8;
    var az = cam.az, el = cam.el;
    var ca = Math.cos(az), sa = Math.sin(az), se = Math.sin(el), ce = Math.cos(el);

    // —— 自动取景 ——
    var hzMax = 10 * KH;                                  // 高度可视范围（米等效）
    var rxMin = 1e9, rxMax = -1e9, ryMin = 1e9, ryMax = -1e9;
    var us = [U0, U1], vs = [V0, V1], hzs = [-hzMax, 0, hzMax];
    for (var i = 0; i < 2; i++) {
      for (var j = 0; j < 2; j++) {
        for (var k = 0; k < 3; k++) {
          var rx = us[i] * ca - vs[j] * sa;
          var ry = -us[i] * sa * se - vs[j] * ca * se + hzs[k] * ce;
          if (rx < rxMin) { rxMin = rx; } if (rx > rxMax) { rxMax = rx; }
          if (ry < ryMin) { ryMin = ry; } if (ry > ryMax) { ryMax = ry; }
        }
      }
    }
    var S0 = Math.min(W * 0.82 / Math.max(0.001, rxMax - rxMin),
                      mainH * 0.82 / Math.max(0.001, ryMax - ryMin));
    var S = S0 * (cam.zoom || 1);
    var cx = W / 2 - (rxMin + rxMax) / 2 * S;
    var cy = mainH / 2 + (ryMin + ryMax) / 2 * S;

    function main(u, v, h) {
      var hz = (h || 0) * KH;
      var rx = u * ca - v * sa;
      var ry = -u * sa * se - v * ca * se + hz * ce;
      return { x: cx + rx * S, y: cy - ry * S };
    }
    // 俯视图（物理空间）：正向俯视 —— u 向右、v 向上，与教科书一致
    var su2 = W * 0.151, sv2 = stripH * 0.30;
    var ox2 = W * 0.50, oy2 = stripTop + stripH * 0.52;
    function strip(u, v) {
      return { x: ox2 + u * su2, y: oy2 - v * sv2 };
    }
    function stripInv(dx, dy) {
      return { du: dx / su2, dv: -dy / sv2 };
    }
    return {
      W: W, H: H, mainH: mainH, stripTop: stripTop, stripH: stripH,
      S: S, KH: KH, sh: S * KH * ce, su: S, sv: S * se, ca: ca, sa: sa, az: az, el: el,
      su2: su2, sv2: sv2, ox2: ox2, oy2: oy2,
      main: main, strip: strip, stripInv: stripInv
    };
  }

  /** 屏幕上“沿 u 方向”每移动 1 px 对应多少个 u（拖动小球/零势能面用，任意视角都准） */
  function uPerPixel(S, u, v, h) {
    var p0 = S.main(u, v, h), p1 = S.main(u + 0.05, v, h);
    var dx = (p1.x - p0.x) / 0.05, dy = (p1.y - p0.y) / 0.05;
    var len2 = dx * dx + dy * dy;
    if (len2 < 1e-9) { return 0; }
    return { dx: dx, dy: dy, len2: len2 };
  }

  /* ---------- 小工具 ---------- */
  function seg(ctx, a, b, color, w, dash) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w || 1;
    if (dash) { ctx.setLineDash(dash); }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
  }
  function text(ctx, str, x, y, color, size, align, weight) {
    ctx.save();
    ctx.fillStyle = color; ctx.font = (weight || '500') + ' ' + (size || 13) + 'px "Microsoft YaHei","PingFang SC","WenQuanYi Zen Hei",sans-serif';
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y); ctx.restore();
  }
  function dot(ctx, p, r, fill, stroke) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.6; ctx.stroke(); }
  }
  function arrow(ctx, a, b, color, w, head) {
    head = head || 8;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w || 1.8;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    var an = Math.atan2(b.y - a.y, b.x - a.x);
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - head * Math.cos(an - 0.4), b.y - head * Math.sin(an - 0.4));
    ctx.lineTo(b.x - head * Math.cos(an + 0.4), b.y - head * Math.sin(an + 0.4));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  /* ---------- 能量地形面 ---------- */
  function drawBasePlane(ctx, S) {
    var c = [S.main(U0, V0, 0), S.main(U1, V0, 0), S.main(U1, V1, 0), S.main(U0, V1, 0)];
    ctx.save();
    ctx.beginPath(); ctx.moveTo(c[0].x, c[0].y);
    for (var i = 1; i < 4; i++) { ctx.lineTo(c[i].x, c[i].y); }
    ctx.closePath(); ctx.fillStyle = THEME.base; ctx.fill();
    // 基准面网格（每 0.5 m 一格）
    for (var u = U0; u <= U1 + 1e-6; u += 0.5) {
      seg(ctx, S.main(u, V0, 0), S.main(u, V1, 0), THEME.baseLine, 1);
    }
    for (var v = V0; v <= V1 + 1e-6; v += 0.4) {
      seg(ctx, S.main(U0, v, 0), S.main(U1, v, 0), THEME.baseLine, 1);
    }
    ctx.restore();
  }

  /**
   * 地形面：在 u = x0 处精确切成两块（红 = 正、蓝 = 负）+ 白色网格
   * sign = +1 画电势 φ 的地形面（正电荷那面）
   * sign = −1 画镜像面（−φ，负电荷那面），用淡一点的配色
   */
  function drawSurface(ctx, S, s, sign, dim, dashed) {
    sign = sign || 1;
    var x0 = s.x0, E = s.E;
    var hA = sign * P.epAt(QREF, U0, x0, E), hB = sign * P.epAt(QREF, U1, x0, E);
    var c0 = S.main(U0, V0, hA), c1 = S.main(U1, V0, hB), c2 = S.main(U1, V1, hB), c3 = S.main(U0, V1, hA);

    // 世界坐标里切：u < x0 与 u > x0 两块，各自一个颜色
    var xc = clamp(x0, U0, U1);
    var us = [U0, xc, U1];
    var cols = (sign > 0) ? [THEME.posFill, THEME.negFill] : [THEME.negFill, THEME.posFill];
    if (dim) {
      cols = (sign > 0) ? ['rgba(226,87,74,0.16)', 'rgba(63,147,214,0.16)']
                        : ['rgba(63,147,214,0.16)', 'rgba(226,87,74,0.16)'];
    }
    for (var k = 0; k < 2; k++) {
      var ua = us[k], ub = us[k + 1];
      if (ub - ua < 1e-6) { continue; }
      var ha = sign * P.epAt(QREF, ua, x0, E), hb = sign * P.epAt(QREF, ub, x0, E);
      var p1 = S.main(ua, V0, ha), p2 = S.main(ub, V0, hb), p3 = S.main(ub, V1, hb), p4 = S.main(ua, V1, ha);
      ctx.save();
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath();
      ctx.fillStyle = cols[k]; ctx.fill(); ctx.restore();
    }

    // 网格：纵向线（沿 v，即等高线方向）+ 横向线（沿 u，即坡向）
    var i, k;
    var gridCol = dim ? 'rgba(232,232,232,0.16)' : THEME.wire;
    var dashPat = dashed ? [4, 4] : null;
    for (k = 0; k <= 16; k++) {                       // 等势线：高度相同的横线
      var u = lerp(U0, U1, k / 16), h = sign * P.epAt(QREF, u, x0, E);
      if (Math.abs(h) > HMAX * 1.35) { continue; }
      seg(ctx, S.main(u, V0, h), S.main(u, V1, h), gridCol, 1, dashPat);
    }
    for (k = 0; k <= 6; k++) {                        // 坡向线
      var v = lerp(V0, V1, k / 6);
      var pa = S.main(U0, v, hA), pb = S.main(U1, v, hB);
      seg(ctx, pa, pb, gridCol, 1, dashPat);
    }
    // 外框
    ctx.save(); ctx.strokeStyle = dim ? 'rgba(255,255,255,0.28)' : THEME.wireStrong; ctx.lineWidth = 1.4;
    if (dashPat) { ctx.setLineDash(dashPat); }
    ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y); ctx.lineTo(c3.x, c3.y);
    ctx.closePath(); ctx.stroke(); ctx.restore();
  }

  /** 零势能线（u = x0 处，坡面与基准面相交的那条线） */
  function drawZeroLine(ctx, S, s) {
    var a = S.main(s.x0, V0, 0), b = S.main(s.x0, V1, 0);
    seg(ctx, a, b, THEME.zero, 2.6, [7, 5]);
    text(ctx, 'Ep = 0', b.x + 6, b.y - 14, THEME.zero, 12.5, 'left');
  }

  /** 剖面线：沿场线方向、过小球所在 v 的坡面剖面 —— φ(x) 是一条直线（q=1 时数值上即 Ep(x)） */
  function drawProfileLine(ctx, S, s) {
    if (S.sh * 4 < 20) { return; }              // 俯视时剖面线贴近视线，画了反而乱
    var v = s.ball.y, N = 64, i, u, p, first = null, last = null, mid = null;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = THEME.gold; ctx.lineWidth = 3.4;
    ctx.shadowColor = 'rgba(255,196,80,0.45)'; ctx.shadowBlur = 10;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      u = lerp(U0, U1, i / N);
      p = S.main(u, v, P.epAt(QREF, u, s.x0, s.E));
      if (i === 0) { ctx.moveTo(p.x, p.y); first = p; } else { ctx.lineTo(p.x, p.y); }
      if (i === Math.round(N * 0.62)) { mid = p; }
      last = p;
    }
    ctx.stroke();
    ctx.restore();
    // 两端端点（可读出这条直线的落差）
    dot(ctx, first, 3.4, '#1b1b1b', THEME.gold);
    dot(ctx, last, 3.4, '#1b1b1b', THEME.gold);
    if (mid) {
      text(ctx, '剖面线 φ(x)：斜率 = E', mid.x, mid.y - 15, THEME.gold, 12.5, 'center', '700');
    }
  }

  /** 高度轴（Ep / J） */
  function drawHeightAxis(ctx, S) {
    if (S.sh * 4 < 26) {                   // 俯视时高度在屏幕上退化，画不出刻度，直接不画
      var ny = (S.W < 760) ? (S.mainH - 12) : (S.mainH - 32);   // 都放在主视图底部，避开图例
      text(ctx, '俯视看不出高度 → 切「斜视 / 侧视」', 16, ny, 'rgba(160,160,160,0.9)', 12.5, 'left');
      return;
    }
    var cor = S.main(U0 - 0.05, V0 - 0.05, 0);
    var ax = Math.max(40, Math.min(cor.x - 18, S.W * 0.16));
    var y0 = cor.y;                        // h = 0 对应的屏幕高度
    var top = y0 - HMAX * 0.78 * S.sh, bot = y0 + HMAX * 0.78 * S.sh;
    arrow(ctx, { x: ax, y: bot }, { x: ax, y: top }, 'rgba(210,210,210,0.6)', 1.4, 8);
    text(ctx, 'φ / V', ax + 24, top + 4, THEME.ink2, 12.5);
    for (var h = -8; h <= 8; h += 4) {
      var y = y0 - h * S.sh;
      seg(ctx, { x: ax - 5, y: y }, { x: ax + 5, y: y }, 'rgba(210,210,210,0.6)', 1.2);
      text(ctx, (h > 0 ? '+' : '') + h, ax - 9, y, THEME.muted, 11.5, 'right');
    }
    text(ctx, '0', ax - 9, y0, THEME.ink2, 11.5, 'right');
  }

  /* ---------- 路径（画在地形面上） ---------- */
  function pathPts(s) {
    var pts = P.pathsFor(s.A, s.B, s.N);
    return pts;
  }
  /** 按 key('line'|'poly'|'curve') 取点列 */
  function pathOf(pts, key) {
    if (key === 'poly') { return pts.polyline; }
    if (key === 'curve') { return pts.curve; }
    return pts.line;
  }
  /** 取当前要画的那条路径的点列（含高度） */
  function activePath(s) {
    return pathOf(pathPts(s), s.pathMode);
  }
  function to3(ctx, S, s, pt) {
    return S.main(pt.x, pt.y, P.epAt(QREF, pt.x, s.x0, s.E));
  }
  function drawOnePath(ctx, S, s, pts, color, width, dash) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width || 2.6;
    if (dash) { ctx.setLineDash(dash); }
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var p = to3(ctx, S, s, pts[i]);
      if (i === 0) { ctx.moveTo(p.x, p.y); } else { ctx.lineTo(p.x, p.y); }
    }
    ctx.stroke(); ctx.restore();
  }

  /** 微元分解：每一小段 →「沿场线一步（有色，升/降）」＋「横穿一步（灰虚线，等高）」 */
  function drawDecomp(ctx, S, s) {
    var r = P.accumulate(activePath(s), s.q);
    var segs = r.segs;
    for (var i = 0; i < segs.length; i++) {
      var g = segs[i];
      var hA2 = P.epAt(QREF, g.x1, s.x0, s.E), hB2 = P.epAt(QREF, g.x2, s.x0, s.E);
      var p1 = S.main(g.x1, g.y1, hA2), p2 = S.main(g.x2, g.y1, hB2);   // 沿场线的一步
      var p3 = S.main(g.x2, g.y2, hB2);                                 // 横穿的一步
      ctx.save();
      ctx.strokeStyle = THEME.gold; ctx.lineWidth = (segs.length > 12 ? 1.4 : 2.8);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      ctx.restore();
      seg(ctx, p2, p3, 'rgba(255,255,255,0.32)', (segs.length > 12 ? 1 : 1.8), [4, 4]);
    }
    // 只标一次「横穿不做功」
    if (segs.length) {
      var g0 = segs[Math.min(2, segs.length - 1)];
      var h0 = P.epAt(QREF, g0.x2, s.x0, s.E);
      var lab = S.main(g0.x2, (g0.y1 + g0.y2) / 2, h0);
      text(ctx, '横穿：不做功', lab.x + 8, lab.y, 'rgba(255,255,255,0.75)', 12, 'left');
    }
  }

  /* ---------- 电荷（小球）＋ 高度尺 ---------- */
  function drawBall(ctx, S, s, pos, qOverride) {
    var qq = (qOverride === undefined) ? s.q : qOverride;
    var sgn = (qq >= 0) ? 1 : -1;
    var phi = P.epAt(QREF, pos.x, s.x0, s.E);      // 该点的电势 φ（V）—— 与放什么电荷无关
    var ep = P.epAt(qq, pos.x, s.x0, s.E);         // 电势能 Ep = qφ（J）
    var pb = S.main(pos.x, pos.y, 0);              // 基准面上的投影
    var pg = S.main(pos.x, pos.y, sgn * phi);      // 球心：贴在“自己那面”上，轴上位置 = ±φ
    var pe = S.main(pos.x, pos.y, ep);             // 能量柱顶：高度 = Ep
    // —— 能量柱（电势能的专用通道）——
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.strokeStyle = (ep >= 0) ? THEME.posLine : THEME.negLine;
    ctx.lineWidth = Math.max(7, clamp(S.S * 0.075, 7, 14) * 1.5);
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(pb.x, pb.y); ctx.lineTo(pe.x, pe.y); ctx.stroke();
    ctx.restore();
    dot(ctx, pe, Math.max(3, clamp(S.S * 0.075, 7, 14) * 0.34), (ep >= 0) ? THEME.posLine : THEME.negLine);
    text(ctx, 'Ep = ' + ep.toFixed(1) + ' J', pe.x + 20, pe.y - 2, THEME.gold, 13.5, 'left');
    // —— 球心位置 = 电势（|q|≠1 时与柱顶不重合，用虚线连一下并标 φ）——
    if (s.show.gauge) { dot(ctx, pb, 3.2, THEME.gold); }
    if (Math.abs(Math.abs(qq) - 1) > 1e-9) {
      seg(ctx, pg, pe, 'rgba(255,255,255,0.30)', 1.2, [3, 4]);
      text(ctx, 'φ = ' + (sgn * phi).toFixed(1) + ' V', pg.x - 14, pg.y + 2, THEME.phi, 12, 'right');
    }
    // 球：半径随 |q| 变大（电荷量只看球的大小）
    var r = clamp(S.S * (0.042 + 0.030 * Math.abs(qq)), 6.5, 24);
    ctx.save(); ctx.shadowColor = qq > 0 ? THEME.posLine : THEME.negLine; ctx.shadowBlur = 16;
    dot(ctx, pg, r, qq > 0 ? THEME.posLine : THEME.negLine);
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#161616'; ctx.font = '700 ' + Math.round(r * 1.5) + 'px "WenQuanYi Zen Hei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(qq > 0 ? '+' : '−', pg.x, pg.y + 1);
    ctx.restore();
    return { ep: ep, phi: phi * sgn, pb: pb, pg: pg, pe: pe };
  }

  /* ---------- 俯视图（物理空间） ---------- */
  function drawPlatesAndField(ctx, S, s) {
    var i, v;
    // 平行板：左“+”、右“−”（场强方向 +u），画成竖直线
    var yTop = S.strip(0, V1 + 0.30).y, yBot = S.strip(0, V0 - 0.30).y;
    var xL = S.strip(U0 - 0.16, 0).x, xR = S.strip(U1 + 0.16, 0).x;
    ctx.save(); ctx.strokeStyle = THEME.posLine; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(xL, yTop); ctx.lineTo(xL, yBot); ctx.stroke(); ctx.restore();
    text(ctx, '+', xL, yTop - 13, THEME.posLine, 18, 'center', '700');
    ctx.save(); ctx.strokeStyle = THEME.negLine; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(xR, yTop); ctx.lineTo(xR, yBot); ctx.stroke(); ctx.restore();
    text(ctx, '−', xR, yTop - 13, THEME.negLine, 18, 'center', '700');

    // 场线：水平、带箭头
    for (i = 0; i <= 4; i++) {
      v = lerp(V0, V1, i / 4);
      var a = S.strip(U0 - 0.16, v), b = S.strip(U1 + 0.16, v);
      seg(ctx, a, b, 'rgba(230,230,230,0.22)', 1.1);
      var m1 = S.strip(U0 + (U1 - U0) * 0.34, v), m2 = S.strip(U0 + (U1 - U0) * 0.66, v);
      arrow(ctx, m1, m2, 'rgba(230,230,230,0.5)', 1.3, 7);
    }
    text(ctx, 'E', xR + 16, yTop + 26, THEME.ink2, 14, 'center', '600');
  }

  function drawStripPaths(ctx, S, s) {
    var pts = pathPts(s);
    var order = s.show.three ? ['line', 'poly', 'curve'] : [s.pathMode];
    for (var i = 0; i < order.length; i++) {
      var key = order[i], arr = pathOf(pts, key);
      var on = (!s.show.three) || s.highlight === key || s.highlight === null;
      ctx.save();
      ctx.strokeStyle = THEME.path[key];
      ctx.globalAlpha = on ? 1 : 0.22;
      ctx.lineWidth = (s.pathMode === key && !s.show.three) ? 3 : 2.2;
      ctx.setLineDash(key === 'curve' ? [] : (key === 'poly' ? [8, 5] : []));
      ctx.beginPath();
      for (var j = 0; j < arr.length; j++) {
        var p = S.strip(arr[j].x, arr[j].y);
        if (j === 0) { ctx.moveTo(p.x, p.y); } else { ctx.lineTo(p.x, p.y); }
      }
      ctx.stroke(); ctx.restore();
    }
    // A / B / M 标记
    var mark = function (pt, name, color, dx, dy) {
      var p = S.strip(pt.x, pt.y);
      dot(ctx, p, 5, '#1b1b1b', color);

      if (segDist(p, z0, z1) < 15) { return 'zero'; }
    }
    if (st.allow.A) { var pA = S.strip(st.A.x, st.A.y); if (dist(p, pA) < 22) { return 'A'; } }
    if (st.allow.B) { var pB = S.strip(st.B.x, st.B.y); if (dist(p, pB) < 22) { return 'B'; } }
    return null;      // 没抓到东西 → 交给相机（旋转视角）
  }

  function onDown(ev) {
    var p = evPos(ev);
    var forceOrbit = (ev.button === 2) || (ev.button === 1) || ev.shiftKey || ev.altKey || ev.metaKey;
    var mode = forceOrbit ? null : hit(p);
    if (!mode && S && p.y < S.mainH) { mode = 'orbit'; }
    if (!mode) { return; }
    drag = { mode: mode, last: p };
    cv.style.cursor = (mode === 'orbit') ? 'move' : 'grabbing';
    ev.preventDefault();
  }
  function onMove(ev) {
    if (!drag) {
      var m = hit(evPos(ev));
      cv.style.cursor = m ? (m === 'ball' ? 'grab' : 'ew-resize') : 'default';
      return;
    }
    var p = evPos(ev), dx = p.x - drag.last.x, dy = p.y - drag.last.y;
    drag.last = p;
    if (drag.mode === 'orbit') {
      cam.az -= dx * 0.008;
      cam.el = clamp(cam.el + dy * 0.006, 0.05, 1.50);
      draw();
      ev.preventDefault();
      return;
    }
    if (drag.mode === 'ball') {
      if (st.allow.t) {
        // 走路径的步骤：把电荷“吸附”到离鼠标最近的路径点上（任意视角、任意路径都稳，不会窜）
        st.t = pathTAt(S, p.x, p.y);
        st.ball = St.pointAt(R.activePath(st), st.t);
      } else {
        var kb = R.uPerPixel(S, st.ball.x, st.ball.y, P.epAt(st.q, st.ball.x, st.x0, st.E));
        if (kb) { st.ball.x = clamp(st.ball.x + (dx * kb.dx + dy * kb.dy) / kb.len2, R.U0, R.U1); }
      }
    } else if (drag.mode === 'zero') {
      var kz = R.uPerPixel(S, st.x0, 0, 0);
      if (kz) { st.x0 = clamp(st.x0 + (dx * kz.dx + dy * kz.dy) / kz.len2, R.X0MIN, R.X0MAX); }
    } else {
      var d = S.stripInv(dx, dy);
      var pt = (drag.mode === 'A') ? st.A : st.B;
      pt.x = clamp(pt.x + d.du, R.U0 + 0.1, R.U1 - 0.1);
      pt.y = clamp(pt.y + d.dv, R.V0, R.V1);
    }
    draw();
    ev.preventDefault();
  }
  function onUp() { if (drag) { drag = null; cv.style.cursor = 'default'; } }

  cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  cv.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  // 滚轮缩放 / 双击复位
  cv.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    cam.zoom = clamp(cam.zoom * Math.exp(-ev.deltaY * 0.0012), 0.5, 2.6);
    draw();
  }, { passive: false });
  cv.addEventListener('dblclick', function () { setView('reset'); });

  // 视角预设按钮
  (function () {
    var btns = document.querySelectorAll('#wrapView button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { setView(this.getAttribute('data-view')); });
    }
  })();

  var rzT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzT); rzT = setTimeout(draw, 120);
  });

  /* ================= 自检 / 调试接口 ================= */
  function hash() {
    var f = R.fitCanvas(cv);
    var W = Math.floor(f.W), H = Math.floor(f.H);
    var d = f.ctx.getImageData(0, 0, W, H).data;
    var h = 2166136261 >>> 0;
    for (var i = 0; i < d.length; i += 61) { h ^= d[i]; h = (h * 16777619) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }

  /** 路径无关验证：不同 N、不同 A/B，比较各路径的 W 与 qE·Δx */
  function verifyPaths() {
    var worst = 0, cases = 0, bad = [];
    var As = [{ x: -1.4, y: -0.6 }, { x: -0.8, y: 0.4 }, { x: 0.4, y: -0.2 }];
    var Bs = [{ x: 1.2, y: 0.6 }, { x: -1.9, y: 0.9 }, { x: 1.8, y: -0.7 }];
    var Ns = [1, 2, 3, 5, 8, 16, 32, 64];
    var qs = [2, 1, -1, -2];
    for (var ai = 0; ai < As.length; ai++) {
      for (var bi = 0; bi < Bs.length; bi++) {
        for (var qi = 0; qi < qs.length; qi++) {
          var q = qs[qi], A = As[ai], B = Bs[bi];
          var exact = P.work(q, A.x, B.x, st.E);
          var pts = P.pathsFor(A, B, 16);
          var cand = [P.accumulate(pts.line, q, st.E).W, P.accumulate(pts.polyline, q, st.E).W];
          for (var ni = 0; ni < Ns.length; ni++) { cand.push(P.accumulate(P.curvePoints(A, B, Ns[ni]), q, st.E).W); }
          for (var ci = 0; ci < cand.length; ci++) {
            cases++;
            var err = Math.abs(cand[ci] - exact);
            if (err > worst) { worst = err; }
            if (err > 1e-9) { bad.push({ A: A, B: B, q: q, err: err }); }
          }
        }
      }
    }
    return { ok: bad.length === 0, cases: cases, maxErr: worst, failed: bad.slice(0, 3) };
  }

  window.__viz = {
    state: st,
    cam: cam,
    setView: setView,
    count: St.STEPS.length,
    go: go, next: next, prev: prev, reset: resetStep, draw: draw,
    hash: hash,
    render: R, phys: P, steps: St,
    verifyPaths: verifyPaths,
    selfTest: function () { return P.runSelfTest(); },
    stepMeta: function () {
      return St.STEPS.map(function (d, i) { return { i: i, act: d.act, title: d.title, allow: Object.keys(d.allow || {}) }; });
    }
  };

  /* ================= 启动 ================= */
  St.apply(st, 0);
  draw();
  // 首帧后再画一次，确保字体就绪
  setTimeout(draw, 60);
})();

</script>
</body>
</html>
